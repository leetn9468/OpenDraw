name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

jobs:
  debug-release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - run: swift --version
      - run: test "$(uname -m)" = arm64
      - run: xcrun swift-format lint --recursive --strict Sources Tests Package.swift
      - run: swift build -c debug && swift build -c release
      - name: Test debug and release
        run: |
          scripts/run-tests-with-isolated-deadlines.sh
          scripts/run-tests-with-isolated-deadlines.sh -c release
      - run: scripts/check-module-dependencies.sh
      - run: scripts/check-clean-room.sh
      - name: Public API symbol documentation surface
        run: swift package dump-symbol-graph && test -n "$(find .build -path '*/symbolgraph/*.symbols.json' -print -quit)"
      - name: macOS 15 minimum-deployment-target compile
        run: MACOSX_DEPLOYMENT_TARGET=15.0 swift build -c release
  sanitizer:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Run AddressSanitizer suite with isolated wall-clock corpus gate
        run: scripts/run-address-sanitizer-tests.sh
  adversarial-golden:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Run adversarial and golden tests with isolated corpus deadline
        run: |
          swift test \
            --filter 'deterministicNativeAndSVG|fixedAdversarial|compositeSceneMatchesProjectGolden' \
            --skip deterministicNativeAndSVGMutationCorpusMeetsDeadline
          swift test --skip-build --filter deterministicNativeAndSVGMutationCorpusMeetsDeadline
  benchmark:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Prove production benchmark timing policy env is exact
        run: scripts/test-benchmark-production-env-exactness.sh
      - name: Run benchmark with frozen absolute targets
        env:
          # Hosted BENCH-5b and BENCH-6 timing are informational under the 2026-07-16 and 2026-07-18 owner decisions; correctness remains blocking.
          BENCH5B_ENFORCEMENT: 'off'
          BENCH6_TIMING_ENFORCEMENT: 'off'
        run: scripts/run-render-benchmark.sh benchmark.txt
      - name: Prove hosted BENCH-5b policy remains falsifiable
        run: scripts/test-benchmark-enforcement-modes.sh
      - name: Prove BENCH-6 timing and correctness policies remain falsifiable
        run: scripts/test-bench6-gate.sh
      - name: Prove inclusive ratio gate remains falsifiable
        run: scripts/test-benchmark-regression-gate.sh
      - name: Report hosted ratio or prepare hosted baseline bootstrap
        if: ${{ always() && hashFiles('benchmark.txt') != '' }}
        env:
          HOSTED_BASELINE: benchmarks/hosted-macos15-arm64-baseline.tsv
        run: |
          set -eu
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          grep -q '^BENCH-6 timing enforcement: bench6_timing_enforcement=off result=INFORMATIONAL reason=owner-decision-2026-07-18$' benchmark.txt
          validate_hosted_baseline() {
            baseline_file=$1
            data_count=$(awk -F "$(printf '\t')" '$1 !~ /^#/ && NF { count += 1 } END { print count + 0 }' "$baseline_file")
            test "$data_count" -ge 5 -a "$data_count" -le 8
            for metric in bench1_p95 bench2_p95 bench2b_p95 bench3_p95 bench3_settle; do
              metric_count=$(awk -F "$(printf '\t')" -v metric="$metric" '$1 == metric { count += 1 } END { print count + 0 }' "$baseline_file")
              test "$metric_count" -eq 1
            done
            bench5a_count=$(awk -F "$(printf '\t')" '$1 == "bench5a_p95" { count += 1 } END { print count + 0 }' "$baseline_file")
            bench5b_count=$(awk -F "$(printf '\t')" '$1 == "bench5b_p95" { count += 1 } END { print count + 0 }' "$baseline_file")
            test "$bench5a_count" -eq "$bench5b_count"
            test "$bench5a_count" -eq 0 -o "$bench5a_count" -eq 1
            bench6_count=$(awk -F "$(printf '\t')" '$1 == "bench6_p95" { count += 1 } END { print count + 0 }' "$baseline_file")
            test "$bench6_count" -eq 0 -o "$bench6_count" -eq 1
          }
          if [ -s "$HOSTED_BASELINE" ]; then
            validate_hosted_baseline "$HOSTED_BASELINE"
            reference_valid_until=$(awk -F= '/^# valid_until=/ { print $2; exit }' "$HOSTED_BASELINE")
            test -n "$reference_valid_until"
            awk '/^# valid_until=/ { print "# valid_until=9999-12-31"; next } { print }' \
              "$HOSTED_BASELINE" > hosted-informational-baseline.tsv
            ratio_status=0
            scripts/check-benchmark-regression.sh \
              hosted-informational-baseline.tsv benchmark.txt benchmark-ratio-body.txt || ratio_status=$?
            rm -f hosted-informational-baseline.tsv
            phase5_metric_count=$(awk -F "$(printf '\t')" '$1 == "bench5a_p95" || $1 == "bench5b_p95" { count += 1 } END { print count + 0 }' "$HOSTED_BASELINE")
            bench6_metric_count=$(awk -F "$(printf '\t')" '$1 == "bench6_p95" { count += 1 } END { print count + 0 }' "$HOSTED_BASELINE")
            if [ "$phase5_metric_count" -eq 0 ] || [ "$bench6_metric_count" -eq 0 ]; then
              bench5a=$(awk '/BENCH-5a undo-redo:/ { print $8 }' benchmark.txt)
              bench5b=$(awk '/BENCH-5b record:/ { print $8 }' benchmark.txt)
              bench6=$(awk '/BENCH-6 tile-edit:/ { print $8 }' benchmark.txt)
              test -n "$bench5a" -a -n "$bench5b" -a -n "$bench6"
              {
                cat "$HOSTED_BASELINE"
                if [ "$phase5_metric_count" -eq 0 ]; then
                  printf '# phase5_metrics_source_commit=%s\n' "$GITHUB_SHA"
                  printf '# phase5_metrics_run_url=%s\n' "$run_url"
                  printf 'bench5a_p95\t%s\t1.25\n' "$bench5a"
                  printf 'bench5b_p95\t%s\t1.25\n' "$bench5b"
                fi
                if [ "$bench6_metric_count" -eq 0 ]; then
                  printf '# tile_t2_bench6_source_commit=%s\n' "$GITHUB_SHA"
                  printf '# tile_t2_bench6_run_url=%s\n' "$run_url"
                  printf 'bench6_p95\t%s\t1.25\n' "$bench6"
                fi
              } > hosted-baseline-candidate.tsv
              validate_hosted_baseline hosted-baseline-candidate.tsv
              {
                cat benchmark-ratio-body.txt
                if [ "$phase5_metric_count" -eq 0 ]; then
                  printf 'bench5a_p95 baseline_ms=%s observed_ms=%s ratio=1.000000 allowed_ratio=1.25 result=BOOTSTRAP\n' "$bench5a" "$bench5a"
                  printf 'bench5b_p95 baseline_ms=%s observed_ms=%s ratio=1.000000 allowed_ratio=1.25 result=BOOTSTRAP\n' "$bench5b" "$bench5b"
                fi
                if [ "$bench6_metric_count" -eq 0 ]; then
                  printf 'bench6_p95 baseline_ms=%s observed_ms=%s ratio=1.000000 allowed_ratio=1.25 result=BOOTSTRAP\n' "$bench6" "$bench6"
                fi
              } > benchmark-ratio-complete.txt
            else
              mv benchmark-ratio-body.txt benchmark-ratio-complete.txt
            fi
            {
              printf 'mode=INFORMATIONAL ratio_enforcement=OFF reason=owner-decision-2026-07-15\n'
              printf 'bench5b_enforcement=off result=INFORMATIONAL reason=owner-decision-2026-07-16\n'
              printf 'bench6_timing_enforcement=off result=INFORMATIONAL reason=owner-decision-2026-07-18\n'
              printf 'baseline=%s\n' "$HOSTED_BASELINE"
              printf 'baseline_valid_until=%s expiry_enforcement=OFF\n' "$reference_valid_until"
              printf 'run_url=%s\n' "$run_url"
              printf 'comparison_exit_status=%s job_effect=NONE\n' "$ratio_status"
              cat benchmark-ratio-complete.txt
            } > benchmark-comparison.txt
            exit 0
          fi

          measured_on=$(date -u +%Y-%m-%d)
          valid_until=$(date -u -v+90d +%Y-%m-%d)
          {
            printf '# mode=BOOTSTRAP_CANDIDATE\n'
            printf '# source_commit=%s\n' "$GITHUB_SHA"
            printf '# source=github-hosted-macos15-arm64\n'
            printf '# runner_image=macos-15\n'
            printf '# run_url=%s\n' "$run_url"
            printf '# measured_on=%s\n' "$measured_on"
            printf '# valid_until=%s\n' "$valid_until"
            awk '/BENCH-1 drag:/ { print "bench1_p95\t" $8 "\t1.25" }' benchmark.txt
            awk '/BENCH-2 pan:/ { print "bench2_p95\t" $8 "\t1.25" }' benchmark.txt
            awk '/BENCH-2b exposure corridor:/ { print "bench2b_p95\t" $9 "\t1.25" }' benchmark.txt
            awk '/BENCH-3 zoom:/ { print "bench3_p95\t" $8 "\t1.25" }' benchmark.txt
            awk '/BENCH-3 settle:/ { print "bench3_settle\t" $3 "\t1.25" }' benchmark.txt
            awk '/BENCH-5a undo-redo:/ { print "bench5a_p95\t" $8 "\t1.25" }' benchmark.txt
            awk '/BENCH-5b record:/ { print "bench5b_p95\t" $8 "\t1.25" }' benchmark.txt
            awk '/BENCH-6 tile-edit:/ { print "bench6_p95\t" $8 "\t1.25" }' benchmark.txt
          } > hosted-baseline-candidate.tsv
          validate_hosted_baseline hosted-baseline-candidate.tsv
          {
            printf 'mode=BOOTSTRAP ratio_enforcement=OFF\n'
            printf 'bench5b_enforcement=off result=INFORMATIONAL reason=owner-decision-2026-07-16\n'
            printf 'bench6_timing_enforcement=off result=INFORMATIONAL reason=owner-decision-2026-07-18\n'
            printf 'candidate=hosted-baseline-candidate.tsv\n'
            printf 'run_url=%s\n' "$run_url"
            while IFS="$(printf '\t')" read -r metric observed allowed; do
              case "$metric" in ''|'#'*) continue ;; esac
              printf '%s baseline_ms=%s observed_ms=%s ratio=1.000000 allowed_ratio=%s result=BOOTSTRAP\n' \
                "$metric" "$observed" "$observed" "$allowed"
            done < hosted-baseline-candidate.tsv
          } > benchmark-comparison.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: benchmark-results, path: benchmark.txt }
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: benchmark-comparison, path: benchmark-comparison.txt }
      - uses: actions/upload-artifact@v7
        if: ${{ always() && hashFiles('hosted-baseline-candidate.tsv') != '' }}
        with: { name: hosted-benchmark-baseline-candidate, path: hosted-baseline-candidate.tsv }
  startup-memory:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - run: scripts/check-startup-p95.sh 20 artifacts/r4/startup-p95.txt
      - run: scripts/check-peak-memory.sh artifacts/r4/peak-memory.txt
      - run: scripts/test-peak-memory-gate.sh artifacts/r4/peak-memory-failure-fixture.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: startup-memory-results, path: artifacts/r4 }
  coverage:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Run coverage suite with isolated wall-clock deadlines
        run: scripts/run-tests-with-isolated-deadlines.sh --coverage-main
      - run: scripts/check-coverage.sh 55
  release-integrity:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - run: scripts/build-release-app.sh
      - uses: actions/upload-artifact@v7
        with: { name: OpenDraw-app, path: dist/OpenDraw.app }
  nightly-reliability:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - run: scripts/nightly-reliability.sh artifacts/r4/reliability-100x100.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: reliability-100x100, path: artifacts/r4/reliability-100x100.txt }
